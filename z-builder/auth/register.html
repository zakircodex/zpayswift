<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Z Builder Register</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/auth.css"></head>
<body>
<main class="shell auth-shell">
<nav class="nav compact-nav auth-top-nav"><div class="brand-lockup"><span class="logo-mark">ZB</span><span>Z Builder Register</span></div></nav>
<section class="hero auth-hero auth-hero-single">
<form class="card hero-card auth-card auth-register-card" data-owner-form>
<h1>Register</h1><p>Fill your profile details to continue.</p>
<div class="form-grid auth-grid"><div class="form-field"><label>Full Name</label><input name="name" required placeholder="Your full name"></div><div class="form-field"><label>BD Number</label><input name="phone" inputmode="tel" required placeholder="01XXXXXXXXX"></div><div class="form-field"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div><div class="form-field"><label>Date of Birth</label><input name="dob" type="date" required></div><div class="form-field full"><label>Address</label><textarea name="address" rows="3" required placeholder="Your address"></textarea></div></div>
<div class="notice section" data-auth-result hidden></div>
<div class="auth-submit-stack"><button class="btn auth-main-btn" type="submit">Continue</button><a class="btn secondary auth-small-action" href="login.html">I already have an account</a></div>
</form>
</section>
<footer class="footer">Z Builder register.</footer>
</main>
<div class="otp-modal" data-register-otp-modal hidden>
  <div class="otp-modal-card">
    <button class="otp-modal-close" type="button" data-register-modal-close>×</button>
    <span class="badge">OTP Verification</span>
    <h2>Create Account</h2>
    <p>OTP sent to <strong data-register-otp-phone>-</strong></p>
    <form data-register-otp-form>
      <div class="form-field full"><label>6 Digit OTP</label><input name="otp" inputmode="numeric" maxlength="6" required placeholder="123456"></div>
      <div class="notice section" data-register-otp-result hidden></div>
      <div class="actions otp-actions"><button class="btn auth-main-btn" type="submit">Verify</button><button class="btn secondary auth-main-btn" type="button" data-register-resend-otp>Resend OTP</button></div>
    </form>
  </div>
</div>
<script src="../assets/js/auth-bd-otp.js"></script>
</body></html>
