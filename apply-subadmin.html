<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Apply as Partner | Z-Pay Swift</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--bg2:#0b1c35;--card:rgba(18,40,77,.94);--card2:rgba(11,31,67,.94);--line:rgba(110,149,221,.20);--text:#ecf4ff;--muted:#9fb5d8;--green:#1fd760;--green2:#5be99c;--blue:#60afe5}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 18% -10%,rgba(31,215,96,.18),transparent 32%),radial-gradient(circle at 88% 0%,rgba(96,175,229,.16),transparent 30%),linear-gradient(135deg,var(--bg) 0%,var(--bg2) 44%,#081325 100%);color:var(--text)}
    a{color:inherit;text-decoration:none}
    .page{width:min(880px,calc(100% - 28px));margin:0 auto;padding:26px 0}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
    .brand{display:flex;align-items:center;gap:10px}
    .mark{width:42px;height:42px;display:grid;place-items:center;border-radius:15px;color:#04120b;font-weight:1000;background:linear-gradient(135deg,var(--green),var(--green2))}
    .brand strong{display:block;color:#f8fbff;font-size:16px}.brand span{display:block;color:var(--muted);font-size:12px}
    .btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:14px;border:0;font-size:13px;font-weight:900;background:linear-gradient(135deg,var(--green),var(--green2));color:#04120b;cursor:pointer}
    .btn.secondary{color:#e6f0ff;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03))}
    .card{padding:24px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,var(--card),var(--card2));box-shadow:0 24px 70px rgba(0,0,0,.32)}
    h1{margin:0;color:#f8fbff;font-size:clamp(30px,5vw,46px);line-height:1.04;letter-spacing:-.045em}
    p{margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.6}
    form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
    .full{grid-column:1/-1}
    label{display:grid;gap:7px;color:#cfe1ff;font-size:13px;font-weight:900}
    input,textarea{width:100%;min-height:46px;padding:0 13px;border:1px solid #2b456c;border-radius:15px;background:#0e213d;color:#f7fbff;outline:none}
    textarea{min-height:96px;padding-top:12px;resize:vertical}
    input::placeholder,textarea::placeholder{color:#7187aa}
    input:focus,textarea:focus{border-color:rgba(31,215,96,.52);box-shadow:0 0 0 3px rgba(31,215,96,.12)}
    .notice{margin-top:14px;padding:12px;border:1px solid rgba(96,175,229,.22);border-radius:18px;background:rgba(255,255,255,.045);color:#dbeafe;font-size:13px;line-height:1.5}
    .message{grid-column:1/-1;min-height:20px;margin:0;color:#ffd6df;font-size:13px}
    footer{margin-top:18px;color:#8da4c7;text-align:center;font-size:12px}
    @media(max-width:620px){.page{padding:16px 0}.nav{align-items:flex-start;flex-direction:column}.nav .btn{width:100%}.card{padding:18px;border-radius:22px}h1{font-size:30px}form{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="nav">
      <a class="brand" href="/"><span class="mark">Z</span><span><strong>Z-Pay Swift</strong><span>Partner application</span></span></a>
      <a class="btn secondary" href="/user">User Panel</a>
    </nav>
    <section class="card">
      <h1>Apply as Partner</h1>
      <p>Share your basic business details. This public form prepares a support message; no API key or private credential is requested here.</p>
      <div class="notice">Never send your password, PIN, API key, or private token through this form.</div>
      <form id="partnerForm">
        <label>Name<input id="name" autocomplete="name" placeholder="Your full name"></label>
        <label>Phone<input id="phone" autocomplete="tel" placeholder="Your WhatsApp/phone number"></label>
        <label class="full">Business area<input id="area" placeholder="City / country / service area"></label>
        <label class="full">Message<textarea id="note" placeholder="Tell us how you want to work with Z-Pay Swift"></textarea></label>
        <p class="message" id="formMessage" aria-live="polite"></p>
        <button class="btn full" type="submit">Submit via WhatsApp</button>
      </form>
    </section>
    <footer>&copy; <span id="year"></span> Z-Pay Swift</footer>
  </main>
  <script>
    (function(){
      document.getElementById('year').textContent = String(new Date().getFullYear());
      var form = document.getElementById('partnerForm');
      var msg = document.getElementById('formMessage');
      form.addEventListener('submit', function(event){
        event.preventDefault();
        var name = document.getElementById('name').value.trim();
        var phone = document.getElementById('phone').value.trim();
        var area = document.getElementById('area').value.trim();
        var note = document.getElementById('note').value.trim();
        if (!name || !phone) {
          msg.textContent = 'Please enter your name and phone number.';
          return;
        }
        msg.textContent = '';
        var text = [
          'Z-Pay Swift partner application',
          'Name: ' + name,
          'Phone: ' + phone,
          'Area: ' + (area || '-'),
          'Message: ' + (note || '-')
        ].join('\n');
        window.location.href = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(text);
      });
    })();
  </script>
</body>
</html>
