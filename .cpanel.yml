---
deployment:
  tasks:
    - /bin/bash -lc 'set -e; REPOPATH=/home/zedpayhe/repositories/zpayswift; DEPLOYPATH=/home/zedpayhe/public_html; /bin/mkdir -p "$DEPLOYPATH" "$DEPLOYPATH/api"; cd "$REPOPATH"; for p in .htaccess index.html download.php track.html privacy.html terms.html apply-subadmin.html assets docs images logo; do if [ -e "$p" ]; then /bin/cp -af "$p" "$DEPLOYPATH"/; fi; done; /bin/cp -af api/. "$DEPLOYPATH/api/"; if [ -d document-ai ]; then /bin/mkdir -p "$DEPLOYPATH/api/document-ai"; /bin/cp -af document-ai/. "$DEPLOYPATH/api/document-ai/"; fi; /usr/bin/find "$DEPLOYPATH/api" \( -name ".git" -o -name ".github" -o -name "private" -o -name "logs" -o -name "node_modules" -o -name "vendor" -o -name ".venv" -o -name "__pycache__" \) -prune -exec /bin/rm -rf {} +; /usr/bin/find "$DEPLOYPATH/api" -type f \( -name ".env" -o -name "config.php" -o -name "error_log" -o -name "*.log" -o -name "*.pyc" -o -name "*.pyo" -o -name "*.sql" -o -name "*.bak" -o -name "*.old" -o -name "*.zip" -o -name "*.tar" -o -name "*.gz" \) -delete; git rev-parse HEAD > "$DEPLOYPATH/deploy_version.txt"; date >> "$DEPLOYPATH/deploy_version.txt"'
