---
deployment:
  tasks:
    - /bin/bash -lc 'set -e; REPOPATH=/home/zedpayhe/repositories/zpayswift; DEPLOYPATH=/home/zedpayhe/public_html; /bin/mkdir -p "$DEPLOYPATH" "$DEPLOYPATH/api"; cd "$REPOPATH"; for p in .htaccess index.html download.php track.html privacy.html terms.html apply-subadmin.html assets docs images logo; do if [ -e "$p" ]; then /bin/cp -af "$p" "$DEPLOYPATH"/; fi; done; for f in .htaccess bootstrap.php config.example.php endpoints.php index.php; do if [ -e "api/$f" ]; then /bin/cp -af "api/$f" "$DEPLOYPATH/api"/; fi; done; for d in api/*; do if [ -d "$d" ]; then name="$(basename "$d")"; case "$name" in my_site|private|logs|node_modules|vendor|.git|.github) continue ;; esac; /bin/mkdir -p "$DEPLOYPATH/api/$name"; /bin/cp -af "$d/." "$DEPLOYPATH/api/$name/"; fi; done; git rev-parse HEAD > "$DEPLOYPATH/deploy_version.txt"; date >> "$DEPLOYPATH/deploy_version.txt"'
