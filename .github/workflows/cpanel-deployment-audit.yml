name: cPanel Deployment Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cpanel-production-deploy.yml'
      - '.github/workflows/cpanel-deployment-audit.yml'
      - '.cpanel-deploy-exclude'
      - '.cpanel.yml'
      - '.htaccess'
      - 'scripts/build_public_deployment.sh'
      - 'scripts/deployment_manifest_diff.php'
      - 'scripts/promote_public_deployment.sh'
      - 'scripts/promote_public_deployment_ftps.sh'
      - 'tests/cpanel_push_deployment_test.php'
      - 'tests/deployment_manifest_test.php'
      - 'docs/cpanel-push-deployment.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML
        run: |
          ruby -e "require 'yaml'; YAML.safe_load_file('.github/workflows/cpanel-production-deploy.yml', aliases: true)"
          ruby -e "require 'yaml'; YAML.safe_load_file('.github/workflows/cpanel-deployment-audit.yml', aliases: true)"
      - name: Validate deployment contract
        run: |
          php tests/cpanel_push_deployment_test.php
          php tests/deployment_manifest_test.php
