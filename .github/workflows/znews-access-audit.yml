name: Z News Access Audit

on:
  push:
    branches:
      - feature/znews-pin-login-instant-comments
      - feature/znews-header-search-menu
      - feature/znews-profile-feed-back-ui
      - feature/znews-fair-feed-infinite-scroll
      - feature/znews-post-reader-comment-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l api/user/znews.php
          php -l api/znews/auth/handoff.php
          php -l api/znews/auth/session.php
          php -l api/znews/lib/domain.php
          php -l api/znews/lib/creator_registry.php
          php -l api/znews/lib/creator_view_policy.php
          php -l api/znews/lib/creator_payout_batches.php
          php -l api/znews/lib/creator_weekly_reviews.php
          php -l api/znews/lib/creator_calendar_reviews.php
          php -l api/znews/lib/creator_view_diagnostics.php
          php -l api/znews/reviews/mine.php
          php -l api/znews/views/start.php
          php -l api/admin/zsky24_creator_admin.php
          php -l api/admin/znews/creators/list.php
          php -l api/admin/znews/creators/status.php
          php -l api/admin/znews/creators/payout_preflight.php
          php -l api/znews/public/creator.php
          php -l api/znews/public/feed.php
          php -l api/znews/public/impression.php
          php -l api/znews/lib/feed_ranking.php
          php -l api/znews/lib/comments/publication.php
          php -l api/znews/lib/comments/create.php
          php -l api/znews/lib/comments/update.php
          php -l api/znews/lib/comments/moderation.php
      - name: Dashboard handoff and guest UI
        run: php tests/znews_dashboard_handoff_guest_ui_test.php
      - name: Fair feed
        run: php tests/znews_fair_feed_test.php
      - name: Instant comments
        run: php tests/znews_instant_comments_test.php
      - name: Post reader UI
        run: php tests/znews_post_reader_ui_test.php
      - name: Web UI regression
        run: php tests/znews_web_ui_foundation_test.php
      - name: Creator period payout and eligibility
        run: php tests/zsky24_creator_period_payout_test.php
      - name: Weekly creator review
        run: php tests/zsky24_weekly_creator_review_test.php
      - name: Invalid view diagnostics
        run: php tests/zsky24_invalid_view_diagnostics_test.php
      - name: Page responsiveness regression
        run: php tests/zsky24_page_responsiveness_test.php
      - name: Reload and guest bootstrap regression
        run: php tests/zsky24_reload_guest_boot_test.php
      - name: Production deploy contract
        run: php tests/zsky24_production_deploy_contract_test.php
      - name: Social engagement regression
        run: php tests/znews_social_engagement_test.php
      - name: Z Sky 24 dual-domain security
        run: php tests/zsky24_dual_domain_test.php
      - name: Z Sky 24 profile-photo origin
        run: php tests/zsky24_profile_photo_origin_test.php
      - name: Z Sky 24 compact composer
        run: php tests/zsky24_compact_composer_test.php
      - name: Z Sky 24 headline and photo
        run: php tests/zsky24_headline_photo_test.php
      - name: Z Sky 24 Back navigation guard
        run: php tests/zsky24_back_navigation_guard_test.php
      - name: Z Sky 24 edit composer
        run: php tests/zsky24_edit_post_composer_test.php
      - name: JavaScript syntax
        run: |
          node --check api/admin/assets/zsky24-admin.js
          node --check znews/assets/znews-config.js
          node --check znews/assets/znews-api.js
          node --check znews/assets/znews-weekly-review.js
          node --check znews/assets/znews-bootstrap.js
          node --check znews/assets/znews-access.js
          node --check znews/assets/znews-feed-ui.js
          node --check znews/assets/znews-profile.js
          node --check znews/assets/znews-reader.js
          node --check znews/assets/znews.js
          node --check znews/assets/znews-header.js
          node --check znews/assets/znews-creator.js
          node --check znews/assets/znews-instant-comments.js
          node --check znews/sw.js
          node --check znews/sw-root.js
