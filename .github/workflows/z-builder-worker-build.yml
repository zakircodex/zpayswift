name: Build Z Builder Worker APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Generated app name"
        required: true
        default: "Z Builder Worker"
      package_name:
        description: "Android package name, e.g. com.myshop.worker"
        required: true
        default: "com.zbuilder.worker"
      app_id:
        description: "Z Builder worker app id"
        required: true
      app_token:
        description: "Private generated worker app token"
        required: true
      api_base:
        description: "API base URL"
        required: true
        default: "https://zpayswift.com"

jobs:
  build:
    name: Build generated worker APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate package name
        shell: bash
        run: |
          if [[ ! "${{ github.event.inputs.package_name }}" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){2,}$ ]]; then
            echo "Invalid package name"
            exit 1
          fi

      - name: Build release APK
        working-directory: z-builder-worker
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -PzbuilderAppName="${{ github.event.inputs.app_name }}" \
            -PzbuilderPackageName="${{ github.event.inputs.package_name }}" \
            -PzbuilderApiBase="${{ github.event.inputs.api_base }}" \
            -PzbuilderAppId="${{ github.event.inputs.app_id }}" \
            -PzbuilderAppToken="${{ github.event.inputs.app_token }}"

      - name: Prepare APK artifact
        shell: bash
        run: |
          mkdir -p build-output
          echo "Generated APK files:"
          find z-builder-worker/app/build/outputs/apk -type f -name "*.apk" -print
          APK_FILE=$(find z-builder-worker/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "No release APK found"
            exit 1
          fi
          cp "$APK_FILE" "build-output/${{ github.event.inputs.app_id }}.apk"
          echo "APK_PATH=build-output/${{ github.event.inputs.app_id }}.apk" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=${{ github.event.inputs.app_id }}-apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.ARTIFACT_NAME }}"
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Notify Z Builder callback
        if: ${{ always() }}
        env:
          CALLBACK_URL: ${{ secrets.ZBUILDER_BUILD_CALLBACK_URL }}
          CALLBACK_KEY: ${{ secrets.ZBUILDER_BUILD_CALLBACK_KEY }}
          APP_ID: ${{ github.event.inputs.app_id }}
          ARTIFACT_NAME: ${{ env.ARTIFACT_NAME }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ -z "$CALLBACK_URL" ] || [ -z "$CALLBACK_KEY" ]; then
            echo "Callback not configured; skipping."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="ARTIFACT_READY"
          else
            STATUS="BUILD_FAILED"
          fi
          curl -sS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-ADMIN-KEY: $CALLBACK_KEY" \
            --data "{\"app_id\":\"$APP_ID\",\"build_status\":\"$STATUS\",\"artifact_name\":\"$ARTIFACT_NAME\",\"run_id\":\"$RUN_ID\",\"run_url\":\"$RUN_URL\"}"
