name: Z News Backend Audit

on:
  push:
    branches:
      - feature/znews-backend-foundation
    paths:
      - 'api/znews/**'
      - 'api/admin/znews/**'
      - 'tests/znews_*_test.php'
      - '.github/workflows/znews-backend-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/znews/**'
      - 'api/admin/znews/**'
      - 'tests/znews_*_test.php'
      - '.github/workflows/znews-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: znews-backend-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show PHP runtime
        run: php -v

      - name: Syntax-check Z News PHP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find api/znews api/admin/znews tests -type f -name '*.php' -print0 | sort -z)
          [ "${#files[@]}" -gt 0 ]
          for file in "${files[@]}"; do
            php -l "$file" >/dev/null
          done
          echo "Syntax passed for ${#files[@]} PHP files."

  regression:
    name: ${{ matrix.test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/znews_ad_impression_ingestion_test.php
          - tests/znews_backend_foundation_test.php
          - tests/znews_end_to_end_contract_test.php
          - tests/znews_http_smoke_test.php
          - tests/znews_main_wallet_transfer_test.php
          - tests/znews_media_backend_test.php
          - tests/znews_moderation_backend_test.php
          - tests/znews_post_lifecycle_test.php
          - tests/znews_post_media_attach_test.php
          - tests/znews_revenue_settlement_test.php
          - tests/znews_social_engagement_test.php
          - tests/znews_view_antifraud_test.php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run regression suite
        shell: bash
        run: |
          set -euo pipefail
          php "${{ matrix.test }}"
