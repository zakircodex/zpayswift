name: Z News Backend Audit

on:
  push:
    branches:
      - feature/znews-backend-foundation
      - feature/znews-web-ui-foundation
      - feature/znews-instant-publish-creator-ui
      - feature/znews-fair-feed-infinite-scroll
      - feature/znews-post-reader-comment-ui
    paths:
      - 'api/znews/**'
      - 'api/admin/znews/**'
      - 'api/lib/firebase.php'
      - 'znews/**'
      - 'docs/znews-*.md'
      - 'tests/znews_*_test.php'
      - 'tests/zsky24_*_test.php'
      - '.cpanel.yml'
      - '.github/workflows/znews-backend-audit.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'api/znews/**'
      - 'api/admin/znews/**'
      - 'api/lib/firebase.php'
      - 'znews/**'
      - 'docs/znews-*.md'
      - 'tests/znews_*_test.php'
      - 'tests/zsky24_*_test.php'
      - '.cpanel.yml'
      - '.github/workflows/znews-backend-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: znews-backend-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: PHP syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show PHP runtime
        run: php -v

      - name: Syntax-check Z News PHP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find api/znews api/admin/znews tests -type f -name '*.php' -print0 | sort -z)
          files+=(api/lib/firebase.php)
          files+=(api/admin/proxy.php api/admin/dashboard.php)
          files+=(tools/zsky24_controlled_ad_test.php)
          files+=(tools/zsky24_auto_settlement_retry.php)
          [ "${#files[@]}" -gt 0 ]
          for file in "${files[@]}"; do
            php -l "$file" >/dev/null
          done
          echo "Syntax passed for ${#files[@]} PHP files."
      - name: Syntax-check Z Sky admin JavaScript
        run: node --check api/admin/assets/zsky24-admin.js

  regression:
    name: ${{ matrix.file }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ad-impression-ingestion
            file: tests/znews_ad_impression_ingestion_test.php
          - id: backend-foundation
            file: tests/znews_backend_foundation_test.php
          - id: end-to-end-contract
            file: tests/znews_end_to_end_contract_test.php
          - id: fair-feed
            file: tests/znews_fair_feed_test.php
          - id: firebase-root-url
            file: tests/znews_firebase_root_url_test.php
          - id: http-smoke
            file: tests/znews_http_smoke_test.php
          - id: instant-publish-creator-ui
            file: tests/znews_instant_publish_creator_ui_test.php
          - id: main-wallet-transfer
            file: tests/znews_main_wallet_transfer_test.php
          - id: media-backend
            file: tests/znews_media_backend_test.php
          - id: moderation-backend
            file: tests/znews_moderation_backend_test.php
          - id: post-lifecycle
            file: tests/znews_post_lifecycle_test.php
          - id: post-media-attach
            file: tests/znews_post_media_attach_test.php
          - id: post-publication-moderation
            file: tests/znews_post_publication_moderation_test.php
          - id: post-reader-ui
            file: tests/znews_post_reader_ui_test.php
          - id: revenue-settlement
            file: tests/znews_revenue_settlement_test.php
          - id: admin-creator-credit-panel
            file: tests/znews_admin_creator_credit_panel_test.php
          - id: automatic-creator-credit
            file: tests/znews_auto_credit_test.php
          - id: self-view-ad-protection
            file: tests/znews_self_view_ad_protection_test.php
          - id: controlled-ad-test-utility
            file: tests/znews_controlled_ad_test_utility_test.php
          - id: social-engagement
            file: tests/znews_social_engagement_test.php
          - id: view-antifraud
            file: tests/znews_view_antifraud_test.php
          - id: web-ui-foundation
            file: tests/znews_web_ui_foundation_test.php
          - id: zsky24-dual-domain
            file: tests/zsky24_dual_domain_test.php
          - id: zsky24-profile-photo-origin
            file: tests/zsky24_profile_photo_origin_test.php
          - id: zsky24-compact-composer
            file: tests/zsky24_compact_composer_test.php
          - id: zsky24-headline-photo
            file: tests/zsky24_headline_photo_test.php
          - id: zsky24-back-navigation-guard
            file: tests/zsky24_back_navigation_guard_test.php
          - id: zsky24-edit-post-composer
            file: tests/zsky24_edit_post_composer_test.php
          - id: zsky24-balance-policy-ui
            file: tests/zsky24_balance_policy_ui_test.php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run regression suite
        id: regression
        shell: bash
        run: |
          set +e
          php "${{ matrix.file }}" > regression-output.txt 2>&1
          status=$?
          cat regression-output.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload failed output
        if: steps.regression.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: znews-failure-${{ matrix.id }}
          path: regression-output.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail unsuccessful suite
        if: steps.regression.outputs.status != '0'
        shell: bash
        run: exit 1
