name: cPanel Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Audit, upload and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
      FTP_PORT: ${{ secrets.CPANEL_FTP_PORT }}
      FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
      FTP_REMOTE_PATH: ${{ secrets.CPANEL_FTP_REMOTE_PATH }}
      PRIMARY_VERIFY_URL: ${{ secrets.CPANEL_PRIMARY_VERIFY_URL }}
      SECONDARY_VERIFY_URL: ${{ secrets.CPANEL_SECONDARY_VERIFY_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for key in FTP_HOST FTP_USER FTP_PASSWORD FTP_REMOTE_PATH PRIMARY_VERIFY_URL; do
            if [ -z "${!key:-}" ]; then
              echo "Required production secret is missing: $key"
              exit 1
            fi
          done
          FTP_PORT="${FTP_PORT:-21}"
          if [[ ! "$FTP_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo 'CPANEL_FTP_HOST contains unsupported characters.'
            exit 1
          fi
          if [[ ! "$FTP_PORT" =~ ^[0-9]{1,5}$ ]]; then
            echo 'CPANEL_FTP_PORT must be numeric.'
            exit 1
          fi
          if [[ "$FTP_REMOTE_PATH" != '/' && ! "$FTP_REMOTE_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]]; then
            echo 'CPANEL_FTP_REMOTE_PATH must be / or an absolute FTP path.'
            exit 1
          fi
          if [[ "$FTP_REMOTE_PATH" == *".."* ]]; then
            echo 'CPANEL_FTP_REMOTE_PATH cannot contain .. segments.'
            exit 1
          fi
          if [[ "$PRIMARY_VERIFY_URL" != https://* ]]; then
            echo 'CPANEL_PRIMARY_VERIFY_URL must use HTTPS.'
            exit 1
          fi
          if [ -n "$SECONDARY_VERIFY_URL" ]; then
            if [[ "$SECONDARY_VERIFY_URL" != https://* ]]; then
              echo 'CPANEL_SECONDARY_VERIFY_URL must use HTTPS.'
              exit 1
            fi
          fi

      - name: Run production preflight audits
        shell: bash
        run: |
          set -euo pipefail
          php tests/run_core_web_tests.php
          find . -path './.git' -prune -o -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l >/dev/null
          find assets api znews tests -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check
          php tests/znews_backend_foundation_test.php
          php tests/znews_web_ui_foundation_test.php
          php tests/znews_end_to_end_contract_test.php
          php tests/znews_view_antifraud_test.php
          php tests/zsky24_dual_domain_test.php
          php tests/zsky24_profile_photo_origin_test.php
          php tests/zsky24_my_posts_navigation_loading_test.php
          php tests/zsky24_compact_composer_test.php
          php tests/zsky24_headline_photo_test.php
          php tests/zsky24_back_navigation_guard_test.php
          php tests/zsky24_edit_post_composer_test.php
          php tests/zsky24_creator_period_payout_test.php
          php tests/zsky24_page_responsiveness_test.php
          php tests/zsky24_reload_guest_boot_test.php
          php tests/zsky24_weekly_creator_review_test.php
          php tests/zsky24_weekly_mobile_preview_performance_test.php
          php tests/zsky24_calendar_review_periods_test.php
          php tests/zsky24_invalid_view_diagnostics_test.php
          php tests/zsky24_monthly_performance_preview_test.php
          php tests/zsky24_monthly_admin_ui_test.php
          php -l api/admin/proxy.php >/dev/null
          php -l api/admin/dashboard.php >/dev/null
          php -l api/admin/zsky24_creator_admin.php >/dev/null
          php -l api/znews/lib/creator_weekly_reviews.php >/dev/null
          php -l api/znews/lib/weekly_live_projection.php >/dev/null
          php -l api/znews/lib/weekly_live_projection_backfill.php >/dev/null
          php -l api/tools/backfill_znews_weekly_live_projection.php >/dev/null
          php -l api/znews/lib/creator_calendar_reviews.php >/dev/null
          php -l api/znews/lib/creator_view_diagnostics.php >/dev/null
          php -l api/znews/lib/creator_monthly_performance.php >/dev/null
          php -l api/znews/reviews/mine.php >/dev/null
          node --check api/admin/assets/zsky24-admin.js
          node --check znews/assets/znews-weekly-review.js
          find api/znews api/admin/znews -type f -name '*.php' -print0 \
            | sort -z \
            | xargs -0 -n1 php -l >/dev/null
          for file in znews/assets/*.js znews/sw.js znews/sw-root.js; do
            node --check "$file"
          done

      - name: Build public deployment package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_public_deployment.sh "$PWD" "$PWD/deployment" "$GITHUB_SHA"

          test -f deployment/api/admin/zsky24_creator_admin.php
          test -f deployment/api/admin/assets/zsky24-admin.js
          test -f deployment/api/admin/assets/zsky24-admin.css
          test -f deployment/api/znews/lib/creator_registry.php
          test -f deployment/api/znews/lib/creator_view_policy.php
          test -f deployment/api/znews/lib/creator_payout_batches.php
          test -f deployment/api/znews/lib/creator_weekly_reviews.php
          test -f deployment/api/znews/lib/weekly_live_projection.php
          test -f deployment/api/znews/lib/weekly_live_projection_backfill.php
          test -f deployment/api/tools/backfill_znews_weekly_live_projection.php
          test -f deployment/api/znews/lib/creator_calendar_reviews.php
          test -f deployment/api/znews/lib/creator_view_diagnostics.php
          test -f deployment/api/znews/lib/creator_monthly_performance.php
          test -f deployment/api/znews/reviews/mine.php
          test -f deployment/znews/assets/znews-weekly-review.js
          test -f deployment/znews/assets/znews-weekly-review.css
          test -f deployment/.well-known/assetlinks.json
          test -s deployment/.deploy-manifest

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Promote approved public release over FTPS
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/promote_public_deployment_ftps.sh deployment

      - name: Explain locked failed promotion
        if: failure()
        shell: bash
        run: |
          echo "If promotion entered maintenance, a failure intentionally keeps .deploy-in-progress in place."
          echo "Fix the failed check and rerun this workflow to complete the release safely."

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          verify_url() {
            local url="$1"
            local body
            body="$(curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 3 \
              -H 'Cache-Control: no-cache' \
              "${url}?v=${GITHUB_SHA}")"
            if [ "$(printf '%s\n' "$body" | head -n1 | tr -d '\r')" != "$GITHUB_SHA" ]; then
              echo "Live deployment marker does not match $GITHUB_SHA at $url"
              exit 1
            fi
          }
          verify_assetlinks() {
            local marker_url="$1"
            local origin="${marker_url%/deploy_version.txt}"
            local body
            body="$(curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 3 \
              -H 'Cache-Control: no-cache' \
              "${origin}/.well-known/assetlinks.json?v=${GITHUB_SHA}")"
            if ! printf '%s' "$body" | grep -Fq 'com.zpayswift.app'; then
              echo "Live Asset Links package is invalid at $origin"
              exit 1
            fi
            if ! printf '%s' "$body" | grep -Fq '34:BD:DD:99:05:1F:70:9A:4E:66:05:39:DF:A3:A7:AC:28:97:F1:60:CB:49:05:D9:73:13:58:EA:B8:C8:C7:80'; then
              echo "Live Asset Links fingerprint is invalid at $origin"
              exit 1
            fi
          }
          verify_url "$PRIMARY_VERIFY_URL"
          verify_assetlinks "$PRIMARY_VERIFY_URL"
          if [ -n "$SECONDARY_VERIFY_URL" ]; then
            verify_url "$SECONDARY_VERIFY_URL"
            verify_assetlinks "$SECONDARY_VERIFY_URL"
          fi
          echo "Verified production commit: $GITHUB_SHA"
